<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>界面集成测试</title>
<link rel="stylesheet" href="../style.css">
<style>body{padding:20px;background:#fff} #out{font:12px ui-monospace,monospace;white-space:pre-wrap}</style>
</head>
<body>
<h1 style="font-size:16px">界面集成测试（自动执行）</h1>
<div id="out">运行中…</div>

<script type="module">
import { weekWindow, reportFileName } from '../src/week.js';
import { classify } from '../src/classify.js';
import { buildReport } from '../src/report.js';
import { isSupported } from '../src/picker.js';
import qrcode from '../vendor/qrcode.esm.js';
import md5 from '../vendor/md5.esm.js';

const out = document.getElementById('out');
const lines = [];
let pass = 0, fail = 0;
const check = (cond, label) => {
  if (cond) { pass++; lines.push('  OK   ' + label); }
  else { fail++; lines.push('  FAIL ' + label); }
};

lines.push('=== 浏览器环境模块加载 ===');
check(typeof weekWindow === 'function', 'week.js 加载');
check(typeof classify === 'function', 'classify.js 加载');
check(typeof buildReport === 'function', 'report.js 加载');
check(typeof isSupported === 'function', 'picker.js 加载');
check(typeof qrcode === 'function', 'qrcode vendor 加载');
check(typeof md5 === 'function', 'md5 vendor 加载');

lines.push('');
lines.push('=== 浏览器内 MD5（与已知值比对）===');
check(md5('abc') === '900150983cd24fb0d6963f7d28e17f72', 'md5("abc")');
check(md5('') === 'd41d8cd98f00b204e9800998ecf8427e', 'md5("")');
check(md5('中文测试') === '089b4943ea034acfa445d050c7913e55', 'md5(中文测试)');
check(md5('中文测试-周报') === '6696e8aefaf25b21c433a806f3a65e7f', 'md5(中文测试-周报)');

lines.push('');
lines.push('=== 二维码渲染（真实 canvas）===');
try {
  const qr = qrcode(0, 'M');
  qr.addData(JSON.stringify({ scene_id: 'test-scene', api_client_type: 3 }));
  qr.make();
  const count = qr.getModuleCount();
  const cell = 5, margin = 2;
  const size = (count + margin * 2) * cell;
  const cv = document.createElement('canvas');
  cv.width = size; cv.height = size;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = '#000';
  for (let r = 0; r < count; r++) for (let c = 0; c < count; c++) {
    if (qr.isDark(r, c)) ctx.fillRect((c + margin) * cell, (r + margin) * cell, cell, cell);
  }
  const data = ctx.getImageData(0, 0, size, size).data;
  let dark = 0;
  for (let i = 0; i < data.length; i += 4) if (data[i] < 128) dark++;
  check(count > 20, `矩阵 ${count}x${count}`);
  check(dark > 100, `黑色像素 ${dark} 个`);
  document.body.appendChild(cv);
  lines.push('  （二维码已渲染到页面下方）');
} catch (e) {
  fail++; lines.push('  FAIL 二维码渲染: ' + e.message);
}

lines.push('');
lines.push('=== 周窗口（浏览器时区环境）===');
const w = weekWindow(new Date(Date.UTC(2026, 9, 16, 6, 0, 0)));
check(w.startWall.getUTCDate() === 9, '起始 10-09');
check(w.endWall.getUTCDate() === 16, '结束 10-16');
check(reportFileName('黄捷', w) === '黄捷-10月9日-10月16日周报.md', '文件名');

lines.push('');
lines.push('=== 生成周报（合成数据）===');
const md = buildReport({
  person: '测试用户',
  window: w,
  now: new Date(Date.UTC(2026, 9, 16, 6, 0, 0)),
  requirements: [{
    project: 'Q助理', ban: '消息与聊天', requirement_num: 1,
    title: '【新功能】测试需求', progress_stage: '待领取',
    current_user: '测试用户', progress_updated_at: '2026-10-15T10:00:00+08:00',
    activities: [{ user: '测试用户', at: '2026-10-15T10:00:00+08:00', old: '提出', new: '待审批', remark: '' }],
  }],
});
check(md.includes('# 测试用户 · 周报'), '标题');
check(md.includes('NO.1'), '需求行');
check(md.includes('测试需求') && !md.includes('【新功能】'), '前缀剥离');
check(md.includes('提出需求'), '动作映射');

lines.push('');
lines.push('=== 目录 API 探测 ===');
lines.push(`  showDirectoryPicker 可用: ${isSupported()}（Chrome/Edge 应为 true）`);
check(true, 'API 探测未抛错');

lines.push('');
lines.push(`=== 结果: ${pass} 通过, ${fail} 失败 ===`);
out.textContent = lines.join('\n');
document.title = fail === 0 ? 'ALL PASS' : `FAIL ${fail}`;
</script>
</body>
</html>
