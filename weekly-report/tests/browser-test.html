<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>界面集成测试</title>
<link rel="stylesheet" href="../style.css">
<style>
  body{padding:20px;background:#fff;display:block;overflow:auto}
  #out{font:12px ui-monospace,monospace;white-space:pre-wrap;margin:0 0 14px}
  h1{font-size:16px;margin:0 0 10px}
</style>
</head>
<body>
<h1>工作台集成测试（自动执行）</h1>
<pre id="out">运行中…</pre>

<script type="module">
import { weekWindow, reportFileName } from '../src/week.js';
import { buildReport } from '../src/report.js';
import qrcode from '../vendor/qrcode.esm.js';
import md5 from '../vendor/md5.esm.js';

const out = document.getElementById('out');
const lines = [];
let pass = 0, fail = 0;
const check = (cond, label) => {
  if (cond) { pass++; lines.push('  OK   ' + label); }
  else { fail++; lines.push('  FAIL ' + label); }
};

lines.push('=== 模块加载 ===');
check(typeof weekWindow === 'function', 'week.js');
check(typeof buildReport === 'function', 'report.js');
check(typeof qrcode === 'function', 'qrcode vendor');
check(typeof md5 === 'function', 'md5 vendor');

const NOW = new Date(Date.UTC(2026, 9, 16, 6, 0, 0));
const w = weekWindow(NOW);
check(w.startWall.getUTCDate() === 9 && w.endWall.getUTCDate() === 16, '窗口 10-09 ~ 10-16');
check(reportFileName('黄捷', w) === '黄捷-10月9日-10月16日周报.md', '文件名');

// 用 fixture 模拟取数结果（浏览器不便直连 API）
const reqs = await (await fetch('../tests/fixtures/my_requirements_with_acts.json')).json();
const banmap = await (await fetch('../tests/fixtures/expected_ban_mine.json')).json();
for (const r of reqs) r.ban = banmap[r.requirement_id] || '通用/未分类';
check(reqs.length === 87, `fixture ${reqs.length} 条`);

const P = '黄捷';
const hasAct = (r) => (r.activities || []).some((a) => {
  if (a.user !== P || !a.at) return false;
  const t = new Date(a.at);
  return t >= w.start && t < w.end;
});
const inWin = reqs.filter(hasAct);
const done = inWin.filter((r) => r.progress_stage === '已完成').length;
const backlog = reqs.filter((r) =>
  !['待领取', '已完成', '已关闭'].includes(r.progress_stage) && r.current_user === P
).length;

lines.push('');
lines.push('=== 指标条数值 ===');
check(inWin.length === 16, `本周有进展 ${inWin.length} 条`);
check(done === 8, `其中已完成 ${done} 条`);
check(backlog > 0, `当前积压 ${backlog} 条`);
lines.push(`    → 指标条: ${inWin.length} / ${done} / ${backlog} / ${reqs.length}条`);

lines.push('');
lines.push('=== 周报生成与基准比对 ===');
const md = buildReport({ person: P, window: w, requirements: reqs, now: NOW });
check(md.length > 0, `生成 ${md.length} 字符`);
check(md.includes(`本周 **${inWin.length} 条需求**`), '概览数字与指标条一致');
check(md.includes(`当前积压 **${backlog} 条**`), '积压数字与指标条一致');
const exp = (await (await fetch('../tests/fixtures/expected_report_0.md')).text()).replace(/\r\n/g, '\n');
check(md === exp, '与 Python 基准逐字节一致');

lines.push('');
lines.push('=== 工作台 DOM 元素齐全（通过 iframe 加载 index.html）===');
{
  const iframe = document.createElement('iframe');
  iframe.style.cssText = 'width:1280px;height:800px;border:1px solid #e2e8ee;border-radius:8px';
  iframe.src = '../index.html';
  document.body.appendChild(iframe);
  await new Promise((r) => { iframe.onload = r; setTimeout(r, 8000); });

  const doc = iframe.contentDocument;
  for (const id of ['metrics','m-win','m-done','m-backlog','m-source',
                    'empty-state','req-panel','req-list','output-panel',
                    'fname-input','dir-path','btn-select-all','btn-select-none',
                    'btn-fetch','btn-generate','btn-save','log','clock','login-pill',
                    'qr-canvas','btn-win-toggle','win-start-text','win-end-text',
                    'steps','steps-fill','btn-console','console','gen-status',
                    'btn-to-archive','btn-back-to-3','archive-stamp','btn-console-close']) {
    check(!!doc.getElementById(id), `#${id}`);
  }

  // 关键：index.html 内的 app.js 应已启动（日志有内容、时钟有值）
  const logText = doc.getElementById('log').textContent;
  check(logText.includes('页面已就绪'), 'index.html 的 app.js 已启动（日志）');
  const clockText = doc.getElementById('clock').textContent;
  check(/^\d{4}-\d{2}-\d{2}/.test(clockText), `时钟已渲染: ${clockText}`);

  // 发布会版：侧栏卡片已全部拆除，改由「五幕 + 幕次导轨」承载
  check(doc.querySelectorAll('.panel-head').length === 0, '无 .panel-head（侧栏卡片标题已拆除）');
  check(doc.querySelector('.workbench') === null, '无 .workbench（左右分栏已废除）');
  check(doc.querySelectorAll('.rail').length === 0, '无 .rail');
  const kickers = [...doc.querySelectorAll('.kicker')].map((e) => e.textContent.replace(/\s+/g, ' ').trim());
  check(kickers.length === 5, `五幕眉标齐全（${kickers.length}）`);
  check(kickers.every((k, i) => k.startsWith(String(i + 1).padStart(2, '0'))),
    `眉标带幕次编号：${kickers.join(' | ')}`);
  const names = [...doc.querySelectorAll('.step-name')].map((e) => e.textContent.trim());
  check(names.join(',') === '扫码,选择日期,结果,生成预览,存档', `幕次导轨：${names.join(' → ')}`);
  check(doc.querySelectorAll('.act[data-act].is-active').length === 1, '开场只亮一幕');

  // 幕次状态机：未解锁不可跳步，解锁后可进可回
  const flow = iframe.contentWindow.__flow;
  flow.gotoStep(4);
  check(doc.body.dataset.step === '1', '未登录时跳不到幕次四（防跳步）');
  flow.unlockStep(4); flow.gotoStep(4);
  check(doc.body.dataset.step === '4', `解锁后可进幕次四（当前 ${doc.body.dataset.step}）`);
  check(doc.querySelectorAll('.act.is-active').length === 1, '任意时刻只亮一幕');
  flow.gotoStep(2);
  check(doc.body.dataset.step === '2' && doc.querySelectorAll('.step.is-done').length === 1,
    '回看已完成幕次，导轨保留完成态（幕次一已点亮）');

  // 字体：Inter 应已注册
  const fonts = [...iframe.contentWindow.document.fonts];
  check(fonts.some((f) => f.family.includes('Inter')), 'Inter 字体已注册');
  iframe.remove();
}

lines.push('');
lines.push('=== 需求分组渲染（模拟 app.js 的 renderReqList）===');
{
  const P = '黄捷';
  const hasAct = (r) => (r.activities || []).some((a) => {
    if (a.user !== P || !a.at) return false;
    const t = new Date(a.at);
    return t >= w.start && t < w.end;
  });
  const inWin = reqs.filter(hasAct);

  // 与 app.js 相同的分组逻辑
  const groups = new Map();
  for (const r of inWin) {
    const key = `${r.project} · ${r.ban}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  }
  check(groups.size > 0, `分成 ${groups.size} 个「项目 · 板块」组`);
  const sum = [...groups.values()].reduce((n, v) => n + v.length, 0);
  check(sum === inWin.length, `组内合计 ${sum} = 列表 ${inWin.length}`);

  // 渲染到真实 DOM，验证结构与样式
  const host = document.createElement('div');
  host.className = 'req-list';
  for (const [key, items] of groups) {
    items.sort((a, b) => a.requirement_num - b.requirement_num);
    const g = document.createElement('div');
    g.className = 'req-group';
    const h = document.createElement('div');
    h.className = 'req-group-head';
    h.innerHTML = `<span>${key}</span><span class="req-group-count">${items.length}</span>`;
    g.appendChild(h);
    for (const r of items) {
      const it = document.createElement('label');
      it.className = 'req-item';
      it.innerHTML =
        `<input type="checkbox" class="req-check" checked>` +
        `<span class="req-main"><span class="req-title-row">` +
        `<span class="req-no">NO.${r.requirement_num}</span>` +
        `<span class="req-title">${r.title}</span></span>` +
        `<span class="req-meta"><span class="stage-dot">${r.progress_stage}</span></span></span>`;
      g.appendChild(it);
    }
    host.appendChild(g);
  }
  document.body.appendChild(host);

  check(host.querySelectorAll('.req-group').length === groups.size, '组容器数量正确');
  check(host.querySelectorAll('.req-item').length === inWin.length, '需求行数量正确');
  const dotCs = getComputedStyle(host.querySelector('.stage-dot'), '::before');
  check(dotCs.width === '6px', `状态圆点渲染 ${dotCs.width}`);
  const itemCs = getComputedStyle(host.querySelector('.req-item'));
  check(itemCs.borderTopWidth === '0px', `需求行无边框 ${itemCs.borderTopWidth}`);
  host.remove();
}

lines.push('');
lines.push('=== MD5 / 二维码 ===');
check(md5('abc') === '900150983cd24fb0d6963f7d28e17f72', 'md5("abc")');
check(md5('') === 'd41d8cd98f00b204e9800998ecf8427e', 'md5("")');
const qr = qrcode(0, 'M');
qr.addData(JSON.stringify({ scene_id: 't', api_client_type: 3 }));
qr.make();
check(qr.getModuleCount() > 20, `二维码矩阵 ${qr.getModuleCount()}x${qr.getModuleCount()}`);

lines.push('');
lines.push(`=== 结果: ${pass} 通过, ${fail} 失败 ===`);
out.textContent = lines.join('\n');
document.title = fail === 0 ? 'ALL PASS' : `FAIL ${fail}`;
</script>
</body>
</html>
